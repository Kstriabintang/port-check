name: Scheduled proxy scan

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours at :17 UTC
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write             # so the bot can commit results back

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install dnspython

      - name: Refresh Proxy.txt if empty
        run: |
          if [ ! -s Proxy.txt ]; then
            echo "Proxy.txt empty — fetching fresh free lists"
            curl -sL --max-time 60 \
              https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/all/data.txt \
              | head -n 3000 > Proxy.txt || true
          fi
          wc -l Proxy.txt

      - name: Run scanner
        run: python port_check.py

      - name: Commit results
        run: |
          git config user.name "portcheck-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f results/ Proxy.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
